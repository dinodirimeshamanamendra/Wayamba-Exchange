<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard | Wayamba Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>

<!-- Placeholder: the real admin dashboard is built in a later phase. -->
<main class="wrap">
  <div class="panel">
    <h1>Admin dashboard</h1>
    <p style="color:var(--muted);margin:0 0 20px" id="signed-in"></p>
    <div class="notice">Post management, user activity and removal of completed posts will be added in a later phase.</div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/app.js"></script>
<script>
  WX.renderFooter();
  WX.me().then(function (me) {
    if (!me.logged_in) { location.replace('login.html'); return; }
    if (me.user.role !== 'admin') { location.replace('profile.html'); return; }
    WX.renderHeader(me, 'account');
    document.getElementById('signed-in').textContent = 'Signed in as ' + me.user.full_name + '.';
  }).catch(function () { location.replace('login.html'); });
</script>
</body>
</html>
